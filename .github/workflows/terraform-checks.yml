name: Terraform checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform test -no-color
      - name: Offline photo importer checks
        run: pwsh -NoProfile -File tests/Test-ImportProductPhotos.ps1
      - name: Offline SQL egress helper checks
        run: pwsh -NoProfile -File tests/Test-ProductsSqlEgress.ps1
